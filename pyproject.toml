[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hep-flare"
version = "0.5.0"
description = "Framework for streamlining the FCC framework powered by b2luigi"
authors = [{ name = "Cameron Harris", email = "cameron.harris@adelaide.edu.au" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "b2luigi>=1.2.0",
    "PyYAML>=6.0",
    "pydantic>1",
]

[project.urls]
Homepage = "https://github.com/CamCoop1/FLARE"

[project.scripts]
flare = "flare.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["flare"]

[tool.hatch.build]
include = [
    "flare/**/*.yaml",
    "flare/**/*.json",
    "flare/**/*.jinja2",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
max-complexity = 10

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["util", "exe", "test"]
known_third_party = ["yaml", "b2luigi"]

[tool.pydocstyle]
ignore = ["D203", "D212", "D406", "D407", "D408", "D409", "D413"]
